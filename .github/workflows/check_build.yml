name: Check build
on:
  push:
    paths-ignore:
      - "**/*.md"

  pull_request:
    types: [opened]
    branches:
      - main
  workflow_dispatch:
  
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  Build:
    name: ${{ matrix.config.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - {
              name: "ubuntu-gcc",
              container: "henrij22/ubuntu-julia-muesli:latest",
            }
    container:
      image: ${{ matrix.config.container }}
      options: --memory-swap="20g" --memory="20g" --cpus="2" --user root
    steps:
      - uses: actions/checkout@v4
        with:
          path: "repo"

      - name: Build
        working-directory: ./repo
        run: |
          # Create and navigate to the build directory
          mkdir cmake-build-${{ matrix.config.name }}
          cd cmake-build-${{ matrix.config.name }}
          
          # Read the contents of temp/prefix
          if [ -f /tmp/prefix.txt ]; then
            PREFIX_PATH=$(tr -d '\n' < /tmp/prefix.txt)
            echo "CMAKE_PREFIX_PATH set to: '$PREFIX_PATH'"

          else
            echo "/tmp/prefix.txt file not found!"
            exit 1
          fi
          
          # The C++ tests link libjulia transitively through libcxxwrap_julia, and an
          # executable must resolve those symbols at link time. Ask Julia for the library
          # rather than relying on CMake finding the executable on PATH.
          JULIA_LIB=$(julia --startup-file=no -e 'using Libdl; print(abspath(Libdl.dlpath("libjulia")))')
          echo "Julia library: $JULIA_LIB"

          # Run CMake with the specified prefix path
          cmake -DCMAKE_PREFIX_PATH="$PREFIX_PATH" -DJulia_LIBRARY="$JULIA_LIB" ../
          
          # Build everything, including the C++ unit tests
          cmake --build . --parallel 2

      - name: C++ unit tests
        working-directory: ./repo/cmake-build-${{ matrix.config.name }}
        run: |
          # `ctest` on an empty test set would pass silently, and the tests are skipped when
          # Julia is not found -- make that a failure rather than a green tick.
          if [ "$(ctest --show-only=json-v1 | grep -c '"name"')" -eq 0 ]; then
            echo "::error::No C++ tests were registered -- did CMake skip them?"
            exit 1
          fi
          ctest --output-on-failure

      - name: Julia integration tests
        working-directory: ./repo
        run: |
          julia --project=julia -e 'import Pkg; Pkg.instantiate()'
          julia --project=julia julia/runtests.jl ${GITHUB_WORKSPACE}/repo/cmake-build-${{ matrix.config.name }}/lib


