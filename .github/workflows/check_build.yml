name: Check build

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

# Keep in sync with the commit MuesliMaterials pins in Yggdrasil:
# https://github.com/JuliaPackaging/Yggdrasil/blob/master/M/MuesliMaterials/build_tarballs.jl
# and with the README.
env:
  MUESLI_COMMIT: 52df6390181aca4b2add1bbc9531c636b8b4160f

jobs:
  build-muesli:
    name: Build MUESLI (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      MUESLI_PREFIX: ${{ matrix.prefix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            shell: bash
            prefix: /tmp/muesli-install
            generator: Unix Makefiles
          - name: macOS
            runner: macos-latest
            shell: bash
            prefix: /tmp/muesli-install
            generator: Unix Makefiles
          - name: Windows
            runner: windows-latest
            shell: msys2 {0}
            prefix: C:/muesli-install
            generator: Ninja
            blas: -DBLA_VENDOR=OpenBLAS
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check MUESLI cache
        uses: actions/cache@v6
        id: muesli-cache
        with:
          path: ${{ matrix.prefix }}
          key: muesli-${{ env.MUESLI_COMMIT }}-${{ runner.os }}-${{ hashFiles('patches/cmakesupport.patch') }}

      - name: Set up the toolchain
        if: steps.muesli-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-toolchain

      - name: Clone MUESLI at the pinned commit
        if: steps.muesli-cache.outputs.cache-hit != 'true'
        run: |
          git -c core.autocrlf=false clone https://gitlab.com/ignacio.romero/muesli.git /tmp/muesli-src
          cd /tmp/muesli-src
          git checkout "${MUESLI_COMMIT}"

      - name: Add CMake support
        if: steps.muesli-cache.outputs.cache-hit != 'true'
        # MUESLI ships no build system of its own. This is the same patch Yggdrasil applies.
        run: |
          cd /tmp/muesli-src
          git apply "${GITHUB_WORKSPACE}/patches/cmakesupport.patch"

      - name: Build and install MUESLI
        if: steps.muesli-cache.outputs.cache-hit != 'true'
        run: |
          cd /tmp/muesli-src
          cmake -B builddir -G "${{ matrix.generator }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${MUESLI_PREFIX}" \
            -DCMAKE_CXX_FLAGS="-I$(bash "${GITHUB_WORKSPACE}/.github/scripts/eigen-include.sh")" \
            ${{ matrix.blas }}
          cmake --build builddir --parallel 4
          cmake --install builddir

  test:
    name: Julia ${{ matrix.julia-version }} (${{ matrix.os }})
    needs: build-muesli
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      MUESLI_PREFIX: ${{ matrix.prefix }}
    # 'pre' is whatever Julia is currently in prerelease; it may break for reasons outside this repo
    continue-on-error: ${{ matrix.julia-version == 'pre' }}
    strategy:
      fail-fast: false
      matrix:
        os: [Linux, macOS, Windows]
        julia-version: ['1.11', '1.12', '1.13', 'pre']
        include:
          - os: Linux
            runner: ubuntu-latest
            shell: bash
            prefix: /tmp/muesli-install
            generator: Unix Makefiles
          - os: macOS
            runner: macos-latest
            shell: bash
            prefix: /tmp/muesli-install
            generator: Unix Makefiles
          - os: Windows
            runner: windows-latest
            shell: msys2 {0}
            prefix: C:/muesli-install
            generator: Ninja

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Restore MUESLI
        uses: actions/cache@v6
        with:
          path: ${{ matrix.prefix }}
          key: muesli-${{ env.MUESLI_COMMIT }}-${{ runner.os }}-${{ hashFiles('patches/cmakesupport.patch') }}
          fail-on-cache-miss: true

      - name: Set up Julia ${{ matrix.julia-version }}
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}

      - name: Install Julia dependencies
        run: julia --project=julia -e 'using Pkg; Pkg.instantiate()'

      - name: Locate libcxxwrap-julia and libjulia
        id: julia-paths
        run: |
          # forward slashes: CMake treats a backslash as an escape
          CXXWRAP_PREFIX=$(julia --project=julia -e 'using CxxWrap; print(replace(CxxWrap.prefix_path(), "\\" => "/"))')
          # The C++ tests link libjulia transitively through libcxxwrap_julia, and an
          # executable has to resolve those symbols at link time. Ask Julia for the path
          # rather than relying on CMake finding the executable on PATH.
          JULIA_LIB=$(julia --startup-file=no -e 'using Libdl; print(replace(abspath(Libdl.dlpath("libjulia")), "\\" => "/"))')
          echo "cxxwrap=$CXXWRAP_PREFIX" >> $GITHUB_OUTPUT
          echo "julialib=$JULIA_LIB" >> $GITHUB_OUTPUT
          echo "libcxxwrap-julia: $CXXWRAP_PREFIX"
          echo "libjulia:         $JULIA_LIB"

      - name: Build libjlmuesli
        run: |
          # doctest lists the tests by running the executable at the end of the build
          source .github/scripts/runtime-env.sh "${{ steps.julia-paths.outputs.cxxwrap }}"
          cmake -B build -G "${{ matrix.generator }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${MUESLI_PREFIX};${{ steps.julia-paths.outputs.cxxwrap }}" \
            -DJulia_LIBRARY="${{ steps.julia-paths.outputs.julialib }}" \
            -DCMAKE_CXX_FLAGS="-I$(bash .github/scripts/eigen-include.sh)"
          cmake --build build --parallel 4

      - name: C++ unit tests
        working-directory: build
        run: |
          source "${GITHUB_WORKSPACE}/.github/scripts/runtime-env.sh" "${{ steps.julia-paths.outputs.cxxwrap }}"
          # `ctest` on an empty test set would pass silently, and the tests are skipped when
          # Julia is not found -- make that a failure rather than a green tick.
          if [ "$(ctest --show-only=json-v1 | grep -c '"name"')" -eq 0 ]; then
            echo "::error::No C++ tests were registered -- did CMake skip them?"
            exit 1
          fi
          ctest --output-on-failure

      - name: Julia integration tests
        run: |
          source .github/scripts/runtime-env.sh "${{ steps.julia-paths.outputs.cxxwrap }}"
          julia --project=julia julia/runtests.jl "${GITHUB_WORKSPACE}/build/lib"
